
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishTrace Lab Records</title>
<style>
body{font-family:Arial,sans-serif;margin:32px;color:#172b4d;background:#f7f8fa}
.wrap{max-width:1000px;margin:auto;background:white;padding:24px;border:1px solid #e1e5eb;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:20px}
th,td{text-align:left;padding:12px;border-bottom:1px solid #e1e5eb;overflow-wrap:anywhere}
th{background:#f4f6f8}
a{color:#1769aa}
</style>
</head>
<body>
<div class="wrap">
  <h1>Training event records</h1>
  <p>Records: {{ rows|length }} · Only non-password fields are stored.</p>

  <form action="{{ url_for('admin_logout') }}" method="POST">
    <button type="submit">Log out</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Email</th>
        <th>Username</th>
        <th>Timestamp (UTC)</th>
      </tr>
    </thead>
    <tbody>
    {% for row in rows %}
      <tr>
        <td>{{ row["id"] }}</td>
        <td>{{ row["email"] }}</td>
        <td>{{ row["username"] }}</td>
        <td>{{ row["created_at"] }}</td>
      </tr>
    {% else %}
      <tr>
        <td colspan="4">No records yet.</td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
</div>
</body>
</html>
